<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&amp;family=Nanum+Pen+Script&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/b4a0c21fb8.js" crossorigin="anonymous"></script>
    <title>me | tom black</title>
</head>
<body>
    <div class="headerWrapper">
        <div class="header">
            <div class="headerText">
                <h1>hi! i'm tom</h1>
                <br>
                <p>i'm on a journey to become a front end developer; with a passion for sleek, minimalist design. i love all things tech, music and cars and the creativity that comes with it all.</p>
                <br>
                <div class="stackWrapper">
                    <div class="stack">
                        <p>stack:</p>
                        <div class="stackIconWrapper">
                            <div class="stackIcon"><i class="fa-brands fa-html5"></i></div>
                            <div class="stackIcon"><i class="fa-brands fa-css"></i></div>
                        </div>
                    </div>
                    <div class="stack">
                        <p>in progress:</p>
                        <div class="stackIconWrapper">
                            <div class="stackIcon"><i class="fa-brands fa-js"></i></div>
                            <div class="stackIcon"><i class="fa-brands fa-react"></i></div>
                        </div>
                    </div>        
                </div>   
            </div>
            <div class="headerAvatar"><img src="img/user-icon.png" alt="Master Chief Buddha"></div>
        </div>
    </div>
</body>
</html>
